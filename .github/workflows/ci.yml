name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/tools/release_tool_constraints.txt
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  minimum-dependencies:
    name: minimum dependencies (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: core
            requirements: tools/minimum_core_requirements.txt
            tests: >-
              tests/backtest/test_onboarding_services.py
              tests/backtest/test_onboarding_commands.py
              tests/backtest/test_cli_artifact_integration.py
              tests/backtest/test_run_artifacts.py
              tests/futures/test_engine_synthetic.py
          - profile: gui
            requirements: tools/minimum_gui_requirements.txt
            tests: tests/backtest/test_ui_regressions.py
    env:
      DATA_ROOT: ${{ runner.temp }}/diepi-empty-data
      QT_QPA_PLATFORM: offscreen
      PYQTGRAPH_QT_LIB: PySide6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Bootstrap the hash-pinned audited pip
        run: python -m pip install -r tools/bootstrap_pip_requirements.txt
      - name: Install the claimed direct dependency minima
        run: >-
          python -m pip install --upgrade --only-binary=:all:
          "setuptools>=77" pytest==7.0.0
          -r ${{ matrix.requirements }}
      - name: Create an explicitly empty market-data root
        run: python -c "from pathlib import Path; Path(r'${{ runner.temp }}/diepi-empty-data').mkdir(parents=True, exist_ok=True)"
      - name: Install diePi without changing the selected versions
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Check the resolved environment
        run: python -m pip check
      - name: Run profile regressions
        run: python -m pytest -q ${{ matrix.tests }}

  data-free-tests:
    name: data-free (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]
        include:
          - os: macos-latest
            python: "3.11"
    env:
      DATA_ROOT: ${{ runner.temp }}/diepi-empty-data
      QT_QPA_PLATFORM: offscreen
      PYQTGRAPH_QT_LIB: PySide6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Bootstrap the hash-pinned audited pip
        run: python -m pip install -r tools/bootstrap_pip_requirements.txt
      - name: Install test and GUI tooling
        run: >-
          python -m pip install --upgrade --only-binary=:all:
          "setuptools>=77" build -e ".[dev,gui]"
      - name: Create an explicitly empty market-data root
        run: python -c "from pathlib import Path; Path(r'${{ runner.temp }}/diepi-empty-data').mkdir(parents=True, exist_ok=True)"
      - name: Run data-free tests with count and outcome gates
        run: >-
          python tools/run_test_gate.py
          --junitxml .release-gate/ci/unit.xml
          --min-passed 2000
          -- -m "not integration" tests/backtest tests/futures
      - name: Run correctness lint gate
        run: python -m ruff check diepi tests tools examples
      - name: Construct the PySide6 main window offscreen
        run: >-
          python -c "from PySide6.QtWidgets import QApplication;
          from diepi.backtest.ui.main_window import MainWindow;
          app = QApplication.instance() or QApplication([]);
          window = MainWindow(); assert window.windowTitle(); window.close()"

  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATA_ROOT: ${{ runner.temp }}/diepi-empty-data
      QT_QPA_PLATFORM: offscreen
      PYQTGRAPH_QT_LIB: PySide6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Bootstrap the hash-pinned audited pip
        run: python -m pip install -r tools/bootstrap_pip_requirements.txt
      - name: Validate the exact committed public tree
        run: python tools/check_public_tree.py --mode git --revision HEAD
      - name: Validate local Markdown links and line anchors
        run: python tools/check_markdown_links.py
      - name: Install test and GUI tooling
        run: >-
          python -m pip install --upgrade --only-binary=:all:
          "setuptools>=77" build -e ".[dev,gui]"
      - name: Create an explicitly empty market-data root
        run: python -c "from pathlib import Path; Path(r'${{ runner.temp }}/diepi-empty-data').mkdir(parents=True, exist_ok=True)"
      - name: Build and inspect wheel and sdist
        run: >-
          python tools/build_release.py
          --output-root .release-gate/ci-build
      - name: Audit project dependencies
        run: python -m pip_audit --strict .
      - name: Audit project dependencies including all optional groups
        run: python -m pip_audit --strict -r requirements.txt
      - name: Audit claimed minimum direct dependency versions
        run: |
          python -m pip_audit --strict --disable-pip --no-deps -r tools/minimum_core_requirements.txt
          python -m pip_audit --strict --disable-pip --no-deps -r tools/minimum_gui_requirements.txt
      - name: Audit the resolved environment including release build tools
        run: |
          python -m pip freeze --all --exclude-editable > "${RUNNER_TEMP}/diepi-resolved-release.txt"
          python -m pip_audit --strict --disable-pip --no-deps -r "${RUNNER_TEMP}/diepi-resolved-release.txt"
      - name: Audit the exact release tool constraints
        run: >-
          python -m pip_audit --strict --disable-pip --no-deps
          -r tools/release_tool_constraints.txt

  integration-smoke:
    name: generated synthetic integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Bootstrap the hash-pinned audited pip
        run: python -m pip install -r tools/bootstrap_pip_requirements.txt
      - name: Install core and test tooling
        run: >-
          python -m pip install --upgrade --only-binary=:all:
          "setuptools>=77" ".[dev]"
      - name: Generate, validate, and backtest synthetic data
        run: diepi demo .release-gate/ci-demo --json

  coverage-baseline:
    name: coverage baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATA_ROOT: ${{ runner.temp }}/diepi-empty-data
      QT_QPA_PLATFORM: offscreen
      PYQTGRAPH_QT_LIB: PySide6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Bootstrap the hash-pinned audited pip
        run: python -m pip install -r tools/bootstrap_pip_requirements.txt
      - name: Install test and GUI tooling
        run: >-
          python -m pip install --upgrade --only-binary=:all:
          "setuptools>=77" ".[dev,gui]"
      - name: Create an explicitly empty market-data root
        run: python -c "from pathlib import Path; Path(r'${{ runner.temp }}/diepi-empty-data').mkdir(parents=True, exist_ok=True)"
      - name: Enforce the reviewed branch-coverage baseline
        run: >-
          python -m coverage run -m pytest -q
          -m "not integration" tests/backtest tests/futures
      - name: Report coverage and enforce baseline
        run: python -m coverage report --fail-under=70.0
